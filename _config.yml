title: FlyPython Resource Catalog
description: >-
  A reviewed catalog of primary Python sources for foundations, web APIs,
  automation, and AI agents.
url: "https://python.flypython.com"
baseurl: ""
repository: flypythoncom/python
timezone: Asia/Shanghai

author:
  name: FlyPython
  url: https://flypython.com/
  email: hello@flypython.com
  github: flypythoncom

lang: en
logo: /assets/images/logo.svg

social:
  name: FlyPython
  links:
    - https://flypython.com/
    - https://github.com/flypythoncom

markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

optional_front_matter:
  enabled: false

readme_index:
  enabled: false

relative_links:
  enabled: false

titles_from_headings:
  enabled: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      image:
        path: /assets/images/og-image.png
        width: 1200
        height: 630
        alt: FlyPython Python Resource Catalog

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - AGENTS.md
  - README.md
  - README_cn.md
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - node_modules/
  - vendor/
  - tools/
  - tests/
  - reports/
