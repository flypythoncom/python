title: FlyPython Resource Catalog
description: >-
  A reviewed catalog of primary Python sources for foundations, web APIs,
  automation, and AI agents.
url: "https://python.flypython.com"
baseurl: ""
repository: flypythoncom/python
timezone: Asia/Shanghai

author:
  name: FlyPython
  url: https://flypython.com/
  email: hello@flypython.com
  github: flypythoncom

lang: en-US
logo: /assets/images/logo.svg

social:
  name: FlyPython
  links:
    - https://flypython.com/
    - https://github.com/flypythoncom

markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

optional_front_matter:
  enabled: false

readme_index:
  enabled: false

relative_links:
  enabled: false

titles_from_headings:
  enabled: false

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - .github/
  - .gitignore
  - .python-version
  - .ruby-version
  - AGENTS.md
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - README.md
  - README_cn.md
  - SECURITY.md
  - Gemfile
  - Gemfile.lock
  - docs/
  - pyproject.toml
  - requirements-dev.lock.txt
  - requirements-dev.txt
  - requirements.lock.txt
  - requirements.txt
  - node_modules/
  - vendor/
  - tools/
  - tests/
  - reports/
