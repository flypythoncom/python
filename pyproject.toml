[project]
name = "flypython"
version = "0.1.1"
description = "Community-maintained source for building reliable Python products in the AI-coding era."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0.2",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "jsonschema>=4.20.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
    "pandas>=3.0.6,<3.1",
    "matplotlib>=3.11.2,<3.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Course starters are deliberately unfinished: pre-imported modules are
# scaffolding the learner will use when implementing the contract.
"courses/*/starter/*.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
